@if (!isPortalRoute) {
  <app-navbar
    [user]="user"
    (openAuth)="openAuth()"
    (logout)="logout()"
  ></app-navbar>
}

<main [class.no-navbar]="isPortalRoute">
  <router-outlet></router-outlet>
</main>

<app-auth-modal
  [isOpen]="isAuthOpen"
  (close)="closeAuth()"
  (loginSuccess)="onLoginSuccess($event)"
></app-auth-modal>

<app-loader></app-loader>
