<div class="grid-3 mb-4">
  <div class="glass-card metric-card">
    <div class="metric-label">REGISTERED OWNERS</div>
    <div class="metric-value color-purple">{{ reports?.totalOwners || owners.length || 0 }}</div>
    <p class="text-muted mt-2 mb-0">Active SaaS Property Owners</p>
  </div>
  <div class="glass-card metric-card">
    <div class="metric-label">TOTAL PG PROPERTIES</div>
    <div class="metric-value color-pink">{{ reports?.totalProperties || properties.length || 0 }}</div>
    <p class="text-muted mt-2 mb-0">PG & Rental Properties</p>
  </div>
  <div class="glass-card metric-card">
    <div class="metric-label">ACTIVE OUTLETS / BRANCHES</div>
    <div class="metric-value color-blue">{{ reports?.totalBranches || branches.length || 0 }}</div>
    <p class="text-muted mt-2 mb-0">Operating Locations</p>
  </div>
</div>
