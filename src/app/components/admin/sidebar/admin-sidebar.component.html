<aside class="dashboard-sidebar">
  <!-- Brand Header -->
  <div class="sidebar-brand">
    <div class="brand-icon-wrap">
      <i class="fa-solid fa-user-shield"></i>
    </div>
    <div>
      <div class="brand-name">StayPulse</div>
      <div class="brand-sub">Super Admin</div>
    </div>
    <button class="sidebar-close-btn d-lg-none" (click)="closeMobile.emit()" aria-label="Close sidebar">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <!-- Section: Overview -->
  <div class="sidebar-section-label">Overview</div>
  <nav class="sidebar-nav sidebar-nav-top">
    <button class="nav-btn" [class.active]="activeTab === 'overview'" (click)="onTabClick('overview')">
      <i class="fa-solid fa-chart-pie nav-icon"></i>
      <span class="nav-text">Dashboard</span>
    </button>
  </nav>

  <!-- Section: Management -->
  <div class="sidebar-section-label">Management</div>
  <nav class="sidebar-nav">
    <button class="nav-btn" [class.active]="activeTab === 'owners'" (click)="onTabClick('owners')">
      <i class="fa-solid fa-building-user nav-icon"></i>
      <span class="nav-text">Property Owners</span>
      <span class="tab-badge">{{ ownersCount }}</span>
    </button>

    <button class="nav-btn" [class.active]="activeTab === 'properties'" (click)="onTabClick('properties')">
      <i class="fa-solid fa-city nav-icon"></i>
      <span class="nav-text">Properties</span>
      <span class="tab-badge">{{ propertiesCount }}</span>
    </button>

    <button class="nav-btn" [class.active]="activeTab === 'branches'" (click)="onTabClick('branches')">
      <i class="fa-solid fa-code-branch nav-icon"></i>
      <span class="nav-text">Branches & Outlets</span>
      <span class="tab-badge">{{ branchesCount }}</span>
    </button>

    <button class="nav-btn" [class.active]="activeTab === 'plans'" (click)="onTabClick('plans')">
      <i class="fa-solid fa-tags nav-icon"></i>
      <span class="nav-text">Subscription Plans</span>
      <span class="tab-badge">{{ plansCount }}</span>
    </button>

    <button class="nav-btn" [class.active]="activeTab === 'reports'" (click)="onTabClick('reports')">
      <i class="fa-solid fa-chart-line nav-icon"></i>
      <span class="nav-text">System Reports</span>
    </button>

    <button class="nav-btn" [class.active]="activeTab === 'settings'" (click)="onTabClick('settings')">
      <i class="fa-solid fa-sliders nav-icon"></i>
      <span class="nav-text">General Settings</span>
    </button>
  </nav>

  <!-- Footer / Logout -->
  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logout.emit()">
      <i class="fa-solid fa-right-from-bracket nav-icon"></i>
      <span class="nav-text">Logout</span>
    </button>
  </div>
</aside>
