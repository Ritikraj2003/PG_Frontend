<div class="table-card">
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Category</th>
          <th>Amount</th>
          <th>Date</th>
          <th>Paid To</th>
        </tr>
      </thead>
      <tbody>
        @for (exp of expenses; track exp.id) {
          <tr>
            <td class="font-bold">{{ exp.title }}</td>
            <td><span class="badge badge-info">{{ exp.category_name || 'General' }}</span></td>
            <td>₹{{ exp.amount }}</td>
            <td>{{ exp.expense_date | date:'mediumDate' }}</td>
            <td>{{ exp.paid_to || 'N/A' }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
