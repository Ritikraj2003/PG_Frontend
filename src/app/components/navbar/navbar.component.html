<nav class="navbar">
  <div class="brand-logo" routerLink="/browse">
    <i class="fa-solid fa-building-user brand-icon"></i>
    <span>StayPulse</span>
    <span class="badge badge-info brand-tag">PG & SaaS</span>
  </div>

  <div class="nav-links">
    <a
      class="btn btn-secondary"
      routerLink="/browse"
      routerLinkActive="btn-primary"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="fa-solid fa-house"></i> Public Browse
    </a>

    @if (user && user.roles.includes('SUPER_ADMIN')) {
      <a
        class="btn btn-secondary"
        routerLink="/admin"
        routerLinkActive="btn-primary"
      >
        <i class="fa-solid fa-shield-halved"></i> Super Admin
      </a>
    }

    @if (user && user.roles.includes('OWNER')) {
      <a
        class="btn btn-secondary"
        routerLink="/owner"
        routerLinkActive="btn-primary"
      >
        <i class="fa-solid fa-building"></i> Owner Portal
      </a>
    }

    @if (user && user.roles.includes('TENANT')) {
      <a
        class="btn btn-secondary"
        routerLink="/tenant"
        routerLinkActive="btn-primary"
      >
        <i class="fa-solid fa-user"></i> Tenant Portal
      </a>
    }

    @if (user) {
      <div class="user-profile">
        <div class="user-info">
          <div class="user-name">{{ user.full_name }}</div>
          <span class="badge badge-info">{{ user.roles.join(', ') }}</span>
        </div>
        <button class="btn btn-danger" (click)="logout.emit()" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    } @else {
      <button class="btn btn-primary" (click)="openAuth.emit()">
        Register / Login
      </button>
    }
  </div>
</nav>
