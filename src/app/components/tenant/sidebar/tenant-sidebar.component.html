<aside class="dashboard-sidebar">
  <!-- Brand Header -->
  <div class="sidebar-brand">
    <div class="brand-icon-wrap">
      <i class="fa-solid fa-house-user"></i>
    </div>
    <div>
      <div class="brand-name">StayPulse</div>
      <div class="brand-sub">Resident Portal</div>
    </div>
    <button class="sidebar-close-btn" (click)="onCloseMobile()" aria-label="Close menu">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <!-- Section: Overview -->
  <div class="sidebar-section-label">Overview</div>
  <nav class="sidebar-nav sidebar-nav-top">
    <button class="nav-btn" [class.active]="activeTab === 'overview'" (click)="onSelectTab('overview')">
      <i class="fa-solid fa-chart-pie nav-icon"></i>
      <span class="nav-text">Dashboard</span>
    </button>
  </nav>

  <!-- Section: Resident Hub -->
  <div class="sidebar-section-label">Resident Hub</div>
  <nav class="sidebar-nav">
    <button class="nav-btn" [class.active]="activeTab === 'explore'" (click)="onSelectTab('explore')">
      <i class="fa-solid fa-compass nav-icon"></i>
      <span class="nav-text">Explore & Book PGs</span>
    </button>

    <button class="nav-btn" [class.active]="activeTab === 'property'" (click)="onSelectTab('property')">
      <i class="fa-solid fa-building-user nav-icon"></i>
      <span class="nav-text">My PG Property</span>
    </button>

    <button class="nav-btn" [class.active]="activeTab === 'bookings'" (click)="onSelectTab('bookings')">
      <i class="fa-solid fa-calendar-check nav-icon"></i>
      <span class="nav-text">Bookings</span>
      @if (bookingsCount > 0) { <span class="tab-badge">{{ bookingsCount }}</span> }
    </button>

    <button class="nav-btn" [class.active]="activeTab === 'invoices'" (click)="onSelectTab('invoices')">
      <i class="fa-solid fa-file-invoice-dollar nav-icon"></i>
      <span class="nav-text">Invoices & Pay</span>
      @if (invoicesCount > 0) { <span class="tab-badge">{{ invoicesCount }}</span> }
    </button>

    <button class="nav-btn" [class.active]="activeTab === 'complaints'" (click)="onSelectTab('complaints')">
      <i class="fa-solid fa-headset nav-icon"></i>
      <span class="nav-text">Complaints</span>
      @if (complaintsCount > 0) { <span class="tab-badge">{{ complaintsCount }}</span> }
    </button>
  </nav>

  <!-- Footer / Logout -->
  <div class="sidebar-footer">
    <button class="logout-btn" (click)="onLogout()">
      <i class="fa-solid fa-right-from-bracket nav-icon"></i>
      <span class="nav-text">Logout</span>
    </button>
  </div>
</aside>
